name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run tests
        run: mvn -B test

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # The image is built once here and the tests run exactly this image
      - name: Build image
        run: docker build -t south-america-guide .

      - name: Start the app with test data
        run: docker compose -f docker-compose.e2e.yml up -d --no-build --wait

      - name: Install Playwright
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium

      - name: Run browser tests
        working-directory: e2e
        run: npx playwright test

      - name: App logs
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs app

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
