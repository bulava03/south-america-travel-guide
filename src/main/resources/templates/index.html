<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>South America Guide - Cultural & Natural Heritage</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
<header>
    <div class="container">
        <a href="/" style="text-decoration: none; color: inherit; cursor: pointer;">
            <h1>🌎 South America Guide</h1>
            <p class="subtitle">Explore Cultural & Natural Heritage</p>
        </a>
    </div>
</header>

<main class="container">
    <!-- Filter Section -->
    <div class="filter-section">
        <form action="/" method="get" class="filter-form">
            <div class="filter-group">
                <label for="country">Filter by Country:</label>
                <select name="country" id="country" onchange="this.form.submit()">
                    <option value="">All Countries</option>
                    <option th:each="c : ${countries}"
                            th:value="${c}"
                            th:text="${c}"
                            th:selected="${c == selectedCountry}">
                    </option>
                </select>
            </div>
        </form>

        <form action="/" method="get" class="search-form">
            <input type="text"
                   name="search"
                   placeholder="Search attractions..."
                   th:value="${searchTerm}">
            <button type="submit">Search</button>
        </form>
    </div>

    <!-- Results Count -->
    <div class="results-info">
        <p>Found <strong th:text="${#lists.size(attractions)}">0</strong> attractions</p>
    </div>

    <!-- Attractions Grid -->
    <div class="attractions-grid" th:if="${not #lists.isEmpty(attractions)}">
        <div class="attraction-card" th:each="attraction : ${attractions}">
            <div class="card-image">
                <img th:src="${attraction.mainImage}"
                     th:alt="${attraction.name}"
                     onerror="this.src='https://via.placeholder.com/300x200?text=No+Image'">
            </div>
            <div class="card-content">
                <h3 th:text="${attraction.name}">Attraction Name</h3>
                <p class="card-type" th:text="${attraction.type}">Type</p>
                <p class="card-country">📍 <span th:text="${attraction.country}">Country</span></p>
                <a th:href="@{/attraction/{id}(id=${attraction.id})}" class="btn-view">View Details</a>
            </div>
        </div>
    </div>

    <!-- No Results Message -->
    <div class="no-results" th:if="${#lists.isEmpty(attractions)}">
        <h2>No attractions found</h2>
        <p>Try adjusting your filters or search terms.</p>
    </div>
</main>

<footer>
    <div class="container">
        <p>&copy; 2025 South America Guide. Data from <a href="https://www.wikidata.org" target="_blank">Wikidata</a></p>
    </div>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</body>
</html>
