<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: pageHead(${attraction.name} + ' - South America Guide')}"></head>
<body>
<header th:replace="~{fragments :: siteHeader('')}"></header>

<main class="page-main container" th:object="${attraction}">
    <a class="back" th:href="@{/places}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
        All places
    </a>

    <div class="detail">
        <!-- The whole photo is always visible: over its blurred copy, or as a print when it is small -->
        <div class="detail-photo" th:switch="*{photoLayout.name()}">
            <th:block th:case="'NONE'">
                <div class="plate-none"></div>
                <span class="plate-none-name" th:text="*{name}">Name</span>
            </th:block>
            <th:block th:case="'PRINT'">
                <div class="plate-print-bg"></div>
                <img class="plate-print" th:src="*{photo}" th:alt="*{name}">
            </th:block>
            <th:block th:case="*">
                <img class="plate-blur" th:src="*{photo}" alt="" aria-hidden="true">
                <img class="plate-fit" th:src="*{photo}" th:alt="*{name}">
            </th:block>
            <a class="photo-credit" th:if="*{photoPage != null}" th:href="*{photoPage}">Photo: Wikimedia Commons</a>
        </div>

        <div class="detail-info">
            <span class="badge" th:if="*{type != null}" th:text="*{#strings.capitalize(type)}">Monument</span>
            <h1 th:text="*{name}">Christ the Redeemer</h1>

            <div class="chips">
                <a class="chip" th:each="country : *{countries}" th:href="@{/places(country=${country})}">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>
                    </svg>
                    <span th:text="${country}">Brazil</span>
                </a>
            </div>

            <th:block th:if="*{description != null}">
                <p class="description" th:text="*{description}">Description</p>
                <p class="source" th:if="*{wikipediaUrl != null}">Text from
                    <a th:href="*{wikipediaUrl}">Wikipedia</a>, CC BY-SA</p>
            </th:block>

            <div class="facts" th:if="*{latitude != null}">
                <div class="fact">
                    <span class="fact-label">Latitude</span>
                    <span class="fact-value" th:text="*{latitudeText}">22.9519° S</span>
                </div>
                <div class="fact">
                    <span class="fact-label">Longitude</span>
                    <span class="fact-value" th:text="*{longitudeText}">43.2105° W</span>
                </div>
            </div>

            <div class="actions">
                <a class="btn btn-sun" th:if="*{mapUrl != null}" th:href="*{mapUrl}">Show on map</a>
                <a class="btn btn-line" th:if="*{wikipediaUrl != null}" th:href="*{wikipediaUrl}">Read on Wikipedia</a>
                <a class="btn btn-line" th:if="*{wikidataPage != null}" th:href="*{wikidataPage}">Wikidata</a>
            </div>
        </div>
    </div>

    <section class="more" th:unless="${#lists.isEmpty(more)}" aria-labelledby="more-title">
        <h2 id="more-title" th:text="'More in ' + *{countries[0]}">More in Brazil</h2>
        <div class="more-cards">
            <a class="mini" th:each="m : ${more}" th:href="@{/attraction/{id}(id=${m.id})}">
                <span class="mini-photo"><img th:if="${m.mainImage != null}" th:src="${m.smallThumbnail}" alt="" loading="lazy"></span>
                <span class="mini-text">
                    <span class="mini-name" th:text="${m.name}">Iguaçu Falls</span>
                    <span class="mini-type" th:text="${m.type}">waterfall</span>
                </span>
            </a>
        </div>
    </section>
</main>
</body>
</html>
