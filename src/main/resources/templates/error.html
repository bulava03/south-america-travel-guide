<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - South America Guide</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header>
    <div class="container">
        <a href="/" style="text-decoration: none; color: inherit; cursor: pointer;">
            <h1>🌎 South America Guide</h1>
            <p class="subtitle">Explore Cultural & Natural Heritage</p>
        </a>
    </div>
</header>

<main class="container">
    <div class="no-results">
        <h2 th:text="${status == 404} ? 'Page not found' : 'Something went wrong'">Something went wrong</h2>
        <p th:text="${status == 404}
                ? 'The attraction or page you are looking for does not exist.'
                : 'Please try again later.'">Please try again later.</p>
    </div>

    <div class="back-section">
        <a href="/" class="btn-back">← Back to List</a>
    </div>
</main>

<footer>
    <div class="container">
        <p>&copy; 2025 South America Guide. Data from <a href="https://www.wikidata.org" target="_blank">Wikidata</a></p>
    </div>
</footer>
</body>
</html>
