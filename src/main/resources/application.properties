# Application Name
spring.application.name=south-america-guide
# Wikidata catalog and sync settings; local .env with passwords
spring.config.import=classpath:wikidata.yml,optional:file:.env[.properties]

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/south_america_guide?useSSL=false&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.use_get_generated_keys=false

# Database schema is managed by Flyway (src/main/resources/db/migration)
spring.flyway.enabled=true

# Logging (verbose logging is in the dev profile)
logging.level.root=INFO

# Wikimedia requires a descriptive User-Agent with contact info
api.user-agent=SouthAmericaGuide/1.0 (https://github.com/bulava03/SouthAmericaGuideProject)

# Admin account
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD}

# OpenAPI (Swagger UI at /swagger-ui.html), admin API is not documented
springdoc.paths-to-match=/api/**
springdoc.paths-to-exclude=/api/admin/**

# Auto-initialization
app.init.data-on-startup=true
