# Stack for the Playwright tests (e2e/): its own MySQL in memory with test data from e2e/seed,
# the app on port 8081. Separate project name, so it does not touch the main stack and its data.
#   docker compose -f docker-compose.e2e.yml up -d --build --wait
#   docker compose -f docker-compose.e2e.yml down
name: south-america-guide-e2e

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: south_america_guide
      MYSQL_USER: guide
      MYSQL_PASSWORD: e2e
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    # Fresh database on every start
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    # The same image as in docker-compose.yml: the tests check what is run
    image: south-america-guide
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/south_america_guide?useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: guide
      DB_PASSWORD: e2e
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: e2e-admin
      # Test data instead of a sync with Wikidata
      APP_INIT_DATAONSTARTUP: "false"
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration,filesystem:/seed
    volumes:
      - ./e2e/seed:/seed:ro
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
