services:
  mysql:
    image: mysql:8.4
    # Dev defaults so that `docker compose up` works without .env; set your own values in .env
    environment:
      MYSQL_DATABASE: south_america_guide
      MYSQL_USER: ${DB_USERNAME:-guide}
      MYSQL_PASSWORD: ${DB_PASSWORD:-local-dev-only-change-me}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    ports:
      # 3307 on the host, so it does not clash with a local MySQL; reachable only from this machine
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # TCP check: MySQL accepts TCP connections only after initialization is complete
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    # The same image is used by docker-compose.e2e.yml and CI
    image: south-america-guide
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/south_america_guide?useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME:-guide}
      DB_PASSWORD: ${DB_PASSWORD:-local-dev-only-change-me}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      SYNC_PER_COUNTRY_LIMIT: ${SYNC_PER_COUNTRY_LIMIT:-25}
      SYNC_MAX_PER_TYPE: ${SYNC_MAX_PER_TYPE:-4}
    ports:
      - "8080:8080"

volumes:
  mysql-data:
